# GitHub가 무료로 안드로이드 설치 파일을 만들어 준다.
#  - 테스트용 APK: 매번 만들어짐 (Actions 화면 > 해당 실행 > Artifacts 에서 받기)
#  - 스토어용 AAB: 서명 비밀값(Secrets)을 넣어두면 같이 만들어짐
name: Android build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # 안드로이드 SDK는 GitHub 서버(ubuntu)에 이미 깔려 있음
      - name: Install
        run: npm ci
      - name: Copy web files into the app
        run: npm run sync
      - name: Build test APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: babyfood-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      # 휴대폰에서 바로 받을 수 있게 '릴리스'에도 올림 (항상 같은 주소로 최신 파일)
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk babyfood.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ github.run_number }}
          name: 테스트 버전 ${{ github.run_number }}
          body: 태블릿·휴대폰에서 babyfood.apk 를 눌러 받아 설치하세요.
          files: babyfood.apk
          make_latest: true
      - name: Prepare signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "path=$RUNNER_TEMP/upload.jks" >> "$GITHUB_OUTPUT"
          fi
      - name: Build store AAB
        if: steps.key.outputs.path != ''
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          UPLOAD_KEYSTORE_PATH: ${{ steps.key.outputs.path }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.path != ''
        with:
          name: babyfood-store-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
